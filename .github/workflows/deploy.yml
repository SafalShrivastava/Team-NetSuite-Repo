name: Deploy to NetSuite

on:
  push:
    branches: [ main ]
    paths:
      - 'NetSuite-Code/src/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install SuiteCloud CLI
        run: npm install -g @oracle/suitecloud-cli

      - name: Create SDF credentials file
        run: |
          mkdir -p $HOME/.suitecloud-sdk
          cat > $HOME/.suitecloud-sdk/credentials << EOF
          [default]
          accountId=${{ secrets.NS_ACCOUNT_ID }}
          tokenId=${{ secrets.NS_TOKEN_ID }}
          tokenSecret=${{ secrets.NS_TOKEN_SECRET }}
          consumerKey=${{ secrets.NS_CONSUMER_KEY }}
          consumerSecret=${{ secrets.NS_CONSUMER_SECRET }}
          EOF

      - name: Deploy via SDF
        run: suitecloud project:deploy --no-preview
        working-directory: NetSuite-Code