name: Deploy to NetSuite

on:
  push:
    branches: [ main ]
    paths:
      - 'NetSuite-Code/src/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run deploy script
        run: node scripts/deploy.js
        env:
          NS_ACCOUNT_ID:      ${{ secrets.NS_ACCOUNT_ID }}
          NS_CONSUMER_KEY:    ${{ secrets.NS_CONSUMER_KEY }}
          NS_CONSUMER_SECRET: ${{ secrets.NS_CONSUMER_SECRET }}
          NS_TOKEN_ID:        ${{ secrets.NS_TOKEN_ID }}
          NS_TOKEN_SECRET:    ${{ secrets.NS_TOKEN_SECRET }}